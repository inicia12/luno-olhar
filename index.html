<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUNO - Teste do Olhar</title>

<script src="./webgazer.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f6fb;
    margin:0;
    padding:20px;
}

h1{
    margin-bottom:10px;
}

#status{
    font-size:20px;
    font-weight:bold;
    margin:20px;
}

#dados{
    font-size:22px;
    margin:20px;
}

button{
    font-size:20px;
    padding:15px 25px;
    border:2px solid #333;
    border-radius:15px;
    background:white;
}

#ponto{
    position:fixed;

    width:40px;
    height:40px;

    border-radius:50%;

    background:red;

    border:5px solid white;

    box-shadow:0 0 0 3px black;

    transform:translate(-50%,-50%);

    pointer-events:none;

    z-index:999999;

    display:none;
}

#teste{
    margin:30px auto;
    max-width:700px;

    background:white;

    border:3px solid #333;

    border-radius:25px;

    padding:40px 20px;

    font-size:22px;
}

#webgazerVideoContainer,
#webgazerVideoFeed,
#webgazerFaceOverlay,
#webgazerFaceFeedbackBox{
    pointer-events:none !important;
}
</style>

</head>

<body>

<h1>
LUNO — TESTE MÍNIMO DO OLHAR
</h1>

<div id="status">
Clique no botão abaixo.
</div>

<button id="iniciar">
ATIVAR CÂMERA
</button>

<div id="dados">
Ainda não recebi coordenadas.
</div>

<div id="teste">
Depois que a câmera abrir, mova o olhar pela tela.
<br><br>
O ponto vermelho deverá mudar de posição.
</div>

<div id="ponto"></div>


<script>

const status =
document.getElementById("status");

const dados =
document.getElementById("dados");

const ponto =
document.getElementById("ponto");

const iniciar =
document.getElementById("iniciar");


async function iniciarTeste(){

    try{

        if(typeof webgazer === "undefined"){

            status.innerText =
            "ERRO: webgazer.js não carregou.";

            return;
        }


        status.innerText =
        "WebGazer carregado. Solicitando câmera...";


        /*
        Esta é a parte principal.

        Sem escolher tracker.
        Sem escolher regression.
        Sem calibração personalizada.
        */


        webgazer.setGazeListener(

            function(data, elapsedTime){

                if(data == null){

                    dados.innerText =
                    "Câmera ativa, mas ainda sem previsão do olhar.";

                    return;
                }


                const x =
                data.x;

                const y =
                data.y;


                dados.innerText =

                "OLHAR DETECTADO ✓  X: "

                +

                Math.round(x)

                +

                "   Y: "

                +

                Math.round(y);


                ponto.style.display =
                "block";


                ponto.style.left =
                x + "px";


                ponto.style.top =
                y + "px";

            }

        );


        await webgazer.begin();


        status.innerText =
        "CÂMERA ATIVA ✓";


        /*
        Vamos mostrar o vídeo
        para confirmar que está funcionando.
        */

        if(webgazer.showVideo){

            webgazer.showVideo(true);

        }


        /*
        O próprio WebGazer pode mostrar
        sua previsão na tela.
        */

        if(webgazer.showPredictionPoints){

            webgazer.showPredictionPoints(true);

        }


        iniciar.style.display =
        "none";

    }

    catch(erro){

        console.error(erro);


        status.innerText =

        "ERRO: "

        +

        (
            erro.message
            ||
            String(erro)
        );

    }

}


iniciar.addEventListener(
    "click",
    iniciarTeste
);

</script>

</body>
</html>
