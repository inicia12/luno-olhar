<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUNO — Controle pelo Olhar</title>

<script src="./webgazer.js"></script>
<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f8fb;
    color:#222;
    text-align:center;
}

header{
    background:white;
    padding:20px;
    border-bottom:1px solid #ddd;
}

h1{
    margin:0 0 10px;
}

#status{
    font-size:18px;
    margin:12px;
    font-weight:bold;
}

button{
    font-size:18px;
    padding:12px 22px;
    border:2px solid #333;
    border-radius:14px;
    background:white;
    cursor:pointer;
    margin:5px;
}

#calibracao{
    display:none;
    position:fixed;
    inset:0;
    background:#f7f8fb;
    z-index:9999;
}

#instrucao{
    position:absolute;
    top:20px;
    left:0;
    right:0;
    font-size:22px;
    font-weight:bold;
}

.ponto{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#625cda;
    border:5px solid white;
    box-shadow:0 0 0 3px #333;
    cursor:pointer;
}

#p1{left:5%;top:12%}
#p2{left:47%;top:12%}
#p3{right:5%;top:12%}

#p4{left:5%;top:47%}
#p5{left:47%;top:47%}
#p6{right:5%;top:47%}

#p7{left:5%;bottom:7%}
#p8{left:47%;bottom:7%}
#p9{right:5%;bottom:7%}

main{
    max-width:1050px;
    margin:25px auto;
    padding:10px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.area{
    height:190px;
    background:white;
    border:3px solid #333;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:bold;
    position:relative;
    overflow:hidden;
}

.area.olhando{
    outline:7px solid rgba(98,92,218,.35);
}

.barra{
    position:absolute;
    bottom:0;
    left:0;
    height:15px;
    width:0%;
    background:#625cda;
}

#olhar{
    position:fixed;
    width:32px;
    height:32px;
    border-radius:50%;
    border:5px solid #e53935;
    background:rgba(255,255,255,.5);
    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:5000;
    display:none;
}

#mensagem{
    position:fixed;
    inset:0;
    background:rgba(255,255,255,.94);
    z-index:8000;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:bold;
}

@media(max-width:700px){
    .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
<h1>LUNO — Controle pelo Olhar</h1>

<div id="status">
Clique em INICIAR.
</div>

<button id="iniciar">
INICIAR CÂMERA
</button>

<button id="recalibrar" style="display:none">
RECALIBRAR
</button>
</header>

<main>

<div class="grid">

<div class="area" data-nome="ÁREA DO ALUNO">
ÁREA DO ALUNO
<div class="barra"></div>
</div>

<div class="area" data-nome="JOGOS">
JOGOS
<div class="barra"></div>
</div>

<div class="area" data-nome="MINI BIBLIOTECA">
MINI BIBLIOTECA
<div class="barra"></div>
</div>

<div class="area" data-nome="TREINO DO OLHAR">
TREINO DO OLHAR
<div class="barra"></div>
</div>

</div>

</main>

<div id="olhar"></div>
<div id="mensagem"></div>

<div id="calibracao">

<div id="instrucao">
CALIBRAÇÃO: olhe para o ponto e clique nele 5 vezes.
</div>

<div class="ponto" id="p1"></div>
<div class="ponto" id="p2"></div>
<div class="ponto" id="p3"></div>
<div class="ponto" id="p4"></div>
<div class="ponto" id="p5"></div>
<div class="ponto" id="p6"></div>
<div class="ponto" id="p7"></div>
<div class="ponto" id="p8"></div>
<div class="ponto" id="p9"></div>

</div>

<script>

const status =
document.getElementById("status");

const iniciar =
document.getElementById("iniciar");

const recalibrar =
document.getElementById("recalibrar");

const calibracao =
document.getElementById("calibracao");

const olhar =
document.getElementById("olhar");

const mensagem =
document.getElementById("mensagem");

let alvoAtual = null;
let inicioOlhar = 0;

const TEMPO = 1500;

let xSuave = null;
let ySuave = null;


async function iniciarLuno(){

    try{

        if(typeof webgazer === "undefined"){
            status.innerText =
            "❌ WebGazer não carregou.";
            return;
        }

        status.innerText =
        "Solicitando acesso à câmera...";

        iniciar.disabled = true;

        webgazer
        .setRegression("ridge")
        .setTracker("TFFacemesh")
        .saveDataAcrossSessions(false)
        .showPredictionPoints(false);

        await webgazer.begin();

        webgazer.showVideoPreview(true);
        webgazer.showFaceOverlay(true);
        webgazer.showFaceFeedbackBox(true);

        status.innerText =
        "✓ Câmera ativada. Agora vamos calibrar.";

        recalibrar.style.display =
        "inline-block";

        webgazer.setGazeListener(function(data){

            if(!data) return;

            if(xSuave === null){
                xSuave = data.x;
                ySuave = data.y;
            }

            xSuave =
            xSuave * 0.75 +
            data.x * 0.25;

            ySuave =
            ySuave * 0.75 +
            data.y * 0.25;

            olhar.style.left =
            xSuave + "px";

            olhar.style.top =
            ySuave + "px";

            verificarAlvo(
                xSuave,
                ySuave
            );

        });

        setTimeout(
            iniciarCalibracao,
            1200
        );

    }

    catch(erro){

        console.error(erro);

        status.innerText =
        "❌ Erro: " +
        (erro.message || erro);

        iniciar.disabled = false;
    }
}


function iniciarCalibracao(){

    calibracao.style.display =
    "block";

    olhar.style.display =
    "none";

    const pontos =
    document.querySelectorAll(".ponto");

    let concluidos = 0;

    pontos.forEach(ponto => {

        ponto.dataset.cliques = "0";
        ponto.style.display = "block";

        ponto.onclick = function(){

            let n =
            Number(
                ponto.dataset.cliques
            );

            n++;

            ponto.dataset.cliques =
            String(n);

            ponto.style.opacity =
            String(1 - n * 0.12);

            if(n >= 5){

                ponto.style.display =
                "none";

                concluidos++;

                if(concluidos === 9){

                    calibracao.style.display =
                    "none";

                    olhar.style.display =
                    "block";

                    status.innerText =
                    "✓ RASTREAMENTO ATIVO — olhe para um dos quatro quadros.";

                }
            }
        };
    });
}


function verificarAlvo(x,y){

    if(
        calibracao.style.display ===
        "block"
    ) return;

    const elemento =
    document.elementFromPoint(x,y);

    const alvo =
    elemento
    ? elemento.closest(".area")
    : null;


    if(alvo !== alvoAtual){

        limparAlvo();

        if(alvo){

            alvoAtual = alvo;

            inicioOlhar =
            performance.now();

            alvo.classList.add(
                "olhando"
            );
        }
    }


    if(alvoAtual){

        const passou =
        performance.now()
        -
        inicioOlhar;

        const porcentagem =
        Math.min(
            100,
            passou / TEMPO * 100
        );

        alvoAtual
        .querySelector(".barra")
        .style.width =
        porcentagem + "%";


        if(passou >= TEMPO){

            const nome =
            alvoAtual.dataset.nome;

            selecionar(nome);

            limparAlvo();
        }
    }
}


function limparAlvo(){

    if(alvoAtual){

        alvoAtual.classList.remove(
            "olhando"
        );

        alvoAtual
        .querySelector(".barra")
        .style.width =
        "0%";
    }

    alvoAtual = null;
}


function selecionar(nome){

    mensagem.innerText =
    "✓ " + nome +
    "\n\nSELECIONADO PELO OLHAR";

    mensagem.style.display =
    "flex";

    setTimeout(function(){

        mensagem.style.display =
        "none";

    },1500);
}


iniciar.onclick =
iniciarLuno;

recalibrar.onclick =
iniciarCalibracao;

</script>

</body>
</html>
