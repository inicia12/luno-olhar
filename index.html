<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LUNO - WebGazer</title>

    <script src="webgazer.js"></script>

</head>


<body>

    <h1>LUNO — TESTE DO OLHAR</h1>

    <h2 id="status">
        Iniciando WebGazer...
    </h2>

    <h2 id="resultado">
        Aguardando o olhar...
    </h2>


    <script>

        webgazer.setGazeListener(
            function(data, elapsedTime) {

                if (data == null) {
                    return;
                }

                var xprediction = data.x;
                var yprediction = data.y;

                document.getElementById("status").innerHTML =
                    "RASTREAMENTO FUNCIONANDO";

                document.getElementById("resultado").innerHTML =
                    "X: " + Math.round(xprediction) +
                    " | Y: " + Math.round(yprediction);

            }
        ).begin();

    </script>

</body>

</html>
