<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste de Controle pelo Olhar</title>
  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding-top: 100px; }
    
    /* Botão interativo acionado pelo olhar */
    .botao-olhar {
      width: 200px;
      height: 100px;
      font-size: 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    /* Barra de progresso visual do tempo de fixação */
    #progresso {
      position: absolute;
      bottom: 0; left: 0; height: 10px;
      background-color: #28a745;
      width: 0%;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>

  <h1>Olhe para o botão para clicar!</h1>
  <button id="meuBotao" class="botao-olhar">
    Fixe o olhar aqui
    <div id="progresso"></div>
  </button>

  <script>
    let tempoFixado = 0;
    const tempoNecessario = 15; // Aproximadamente 1.5 segundos de fixação
    const botao = document.getElementById('meuBotao');
    const barraProgresso = document.getElementById('progresso');

    window.onload = async () => {
      await webgazer.setGazeListener((data, elapsedTime) => {
        if (!data) return;

        // Pega a posição do botão na tela
        const rect = botao.getBoundingClientRect();

        // Verifica se o olhar (data.x, data.y) está dentro da área do botão
        const olhandoParaOBotao = (
          data.x >= rect.left &&
          data.x <= rect.right &&
          data.y >= rect.top &&
          data.y <= rect.bottom
        );

        if (olhandoParaOBotao) {
          tempoFixado++;
          let porcentagem = (tempoFixado / tempoNecessario) * 100;
          barraProgresso.style.width = Math.min(porcentagem, 100) + '%';

          // Dispara a ação de clique se o olhar permanecer o tempo suficiente
          if (tempoFixado >= tempoNecessario) {
            botao.click();
            tempoFixado = 0; // Reseta
          }
        } else {
          // Se desviar o olhar, reseta a contagem
          tempoFixado = 0;
          barraProgresso.style.width = '0%';
        }
      }).begin();

      webgazer.showPredictionPoints(true);
    };

    // Ação acionada pelo olhar
    botao.addEventListener('click', () => {
      alert('Ação executada com o olhar!');
      barraProgresso.style.width = '0%';
    });
  </script>
</body>
</html>
