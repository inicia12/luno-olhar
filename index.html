<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Teste WebGazer</title>

    <script src="./webgazer.js"></script>
</head>

<body>

<h1>TESTE WEBGAZER</h1>

<p id="status">Carregando...</p>

<h2 id="resultado">
X: aguardando | Y: aguardando
</h2>

<button id="iniciar">
ABRIR CÂMERA
</button>

<script>

const status = document.getElementById("status");
const resultado = document.getElementById("resultado");
const iniciar = document.getElementById("iniciar");

iniciar.onclick = function () {

    if (typeof webgazer === "undefined") {
        status.innerText = "ERRO: WebGazer não carregou";
        return;
    }

    status.innerText = "WebGazer carregou. Iniciando...";

    webgazer
        .setGazeListener(function(data, elapsedTime) {

            if (data == null) {
                resultado.innerText =
                    "WebGazer ativo, mas ainda sem coordenadas";
                return;
            }

            resultado.innerText =
                "X: " + Math.round(data.x) +
                " | Y: " + Math.round(data.y);

        })
        .begin();

    status.innerText = "WebGazer iniciado";
};

</script>

</body>
</html>
