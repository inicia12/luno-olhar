<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LUNO - Teste MediaPipe</title>

<script
  src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
  crossorigin="anonymous">
</script>

<style>
body{
  font-family:Arial,sans-serif;
  text-align:center;
  background:#f7f8fb;
  padding:40px;
}
button{
  padding:16px 24px;
  font-size:20px;
  border-radius:15px;
  background:white;
  border:2px solid #333;
}
video{
  display:block;
  width:480px;
  max-width:90%;
  margin:25px auto;
  border:4px solid #333;
  border-radius:18px;
  transform:scaleX(-1);
}
#status{
  font-size:20px;
  margin:20px;
}
</style>
</head>

<body>

<h1>LUNO — teste da câmera</h1>

<div id="status">Clique para testar somente a câmera.</div>

<button id="camera">ATIVAR CÂMERA</button>

<video id="video" autoplay muted playsinline></video>

<script>
const statusEl = document.getElementById("status");
const video = document.getElementById("video");

document.getElementById("camera").onclick = async () => {

  try {

    statusEl.textContent = "Solicitando câmera...";

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:true,
        audio:false
      });

    video.srcObject = stream;

    statusEl.textContent =
      "✅ CÂMERA FUNCIONANDO!";

  }

  catch(err){

    statusEl.textContent =
      "❌ Erro da câmera: " +
      err.name +
      " - " +
      err.message;

  }

};
</script>

</body>
</html>
