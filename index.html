<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUNO — Teste do Olhar</title>

<script src="./webgazer.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f6fb;
    text-align:center;
    color:#222;
}

header{
    background:white;
    padding:20px;
    border-bottom:1px solid #ddd;
    position:relative;
    z-index:100;
}

h1{
    margin:0 0 15px;
}

#status{
    font-size:18px;
    font-weight:bold;
    margin:12px;
}

#coords{
    margin:10px;
    font-size:16px;
}

#iniciar{
    font-size:18px;
    padding:14px 25px;
    border:2px solid #333;
    border-radius:15px;
    background:white;
    cursor:pointer;
}

main{
    max-width:1000px;
    margin:auto;
    padding:25px;
    position:relative;
    z-index:100;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.area{
    position:relative;
    min-height:180px;

    border:3px solid #333;
    border-radius:25px;

    background:white;

    font-size:24px;
    font-weight:bold;

    cursor:pointer;

    z-index:200;

    overflow:hidden;
}

.area:active{
    transform:scale(.98);
}

.area.olhando{
    outline:8px solid rgba(98,92,218,.35);
}

.barra{
    position:absolute;
    bottom:0;
    left:0;

    height:15px;
    width:0%;

    background:#625cda;
}

#pontoOlhar{
    position:fixed;

    width:35px;
    height:35px;

    border-radius:50%;

    border:5px solid red;

    background:rgba(255,255,255,.5);

    pointer-events:none;

    transform:translate(-50%,-50%);

    z-index:99999;

    display:none;
}

#mensagem{
    position:fixed;

    inset:0;

    background:rgba(255,255,255,.95);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:999999;

    font-size:32px;
    font-weight:bold;

    padding:30px;
}


/* IMPORTANTE:
   impede a câmera do WebGazer
   de bloquear os botões */

#webgazerVideoContainer,
#webgazerVideoFeed,
#webgazerFaceOverlay,
#webgazerFaceFeedbackBox{

    pointer-events:none !important;
}


/* CELULAR */

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .area{
        min-height:120px;
    }

}

</style>

</head>


<body>


<header>

<h1>
LUNO — Teste do Controle pelo Olhar
</h1>

<div id="status">
PRIMEIRO TESTE: toque em um dos botões abaixo.
</div>

<div id="coords">
Olhar: ainda não iniciado
</div>

<button id="iniciar">
ATIVAR CÂMERA E OLHAR
</button>

</header>


<main>

<div class="grid">


<button
class="area"
data-nome="ÁREA DO ALUNO">

ÁREA DO ALUNO

<div class="barra"></div>

</button>


<button
class="area"
data-nome="JOGOS">

JOGOS

<div class="barra"></div>

</button>


<button
class="area"
data-nome="MINI BIBLIOTECA">

MINI BIBLIOTECA

<div class="barra"></div>

</button>


<button
class="area"
data-nome="TREINO DO OLHAR">

TREINO DO OLHAR

<div class="barra"></div>

</button>


</div>

</main>


<div id="pontoOlhar"></div>

<div id="mensagem"></div>


<script>

const status =
document.getElementById("status");

const coords =
document.getElementById("coords");

const iniciar =
document.getElementById("iniciar");

const pontoOlhar =
document.getElementById("pontoOlhar");

const mensagem =
document.getElementById("mensagem");


let alvoAtual = null;

let inicioOlhar = 0;

let xSuave = null;

let ySuave = null;

let bloqueado = false;


const TEMPO =
1500;


/* ============================= */
/* TESTE DOS BOTÕES               */
/* ============================= */


document
.querySelectorAll(".area")
.forEach(botao => {

    botao.addEventListener(
        "click",
        function(){

            selecionar(
                botao.dataset.nome,
                "TOQUE / MOUSE"
            );

        }
    );

});


function selecionar(
nome,
origem
){

    if(bloqueado)
        return;


    bloqueado =
    true;


    mensagem.innerHTML =

    "✓ " +
    nome +

    "<br><br>" +

    "<span style='font-size:20px'>" +

    "FUNCIONOU POR " +
    origem +

    "</span>";


    mensagem.style.display =
    "flex";


    setTimeout(
        function(){

            mensagem.style.display =
            "none";

            bloqueado =
            false;

        },

        1200
    );

}


/* ============================= */
/* RASTREAMENTO DO OLHAR          */
/* ============================= */


async function ativarOlhar(){

    if(
        typeof webgazer
        ===
        "undefined"
    ){

        status.innerText =
        "❌ WebGazer não carregou.";

        return;
    }


    try{

        iniciar.disabled =
        true;


        status.innerText =
        "Solicitando câmera...";


        webgazer
        .saveDataAcrossSessions(false)
        .showPredictionPoints(false);


        await webgazer.begin();


        /* deixa câmera visível */

        try{

            webgazer
            .showVideoPreview(true);

        }
        catch(e){}


        /* remove overlays que podem
           atrapalhar os botões */

        try{

            webgazer
            .showFaceOverlay(false);

        }
        catch(e){}


        try{

            webgazer
            .showFaceFeedbackBox(false);

        }
        catch(e){}


        status.innerText =
        "✓ CÂMERA ATIVA — procurando seu olhar...";


        webgazer.setGazeListener(

            function(data){

                if(!data){

                    coords.innerText =
                    "Câmera ativa — aguardando dados dos olhos...";

                    return;

                }


                /* suaviza movimento */

                if(
                    xSuave === null
                ){

                    xSuave =
                    data.x;

                    ySuave =
                    data.y;

                }

                else{

                    xSuave =
                    xSuave * 0.75
                    +
                    data.x * 0.25;


                    ySuave =
                    ySuave * 0.75
                    +
                    data.y * 0.25;

                }


                coords.innerText =

                "👁 OLHAR DETECTADO — X: " +

                Math.round(xSuave)

                +

                " | Y: "

                +

                Math.round(ySuave);


                pontoOlhar.style.display =
                "block";


                pontoOlhar.style.left =
                xSuave + "px";


                pontoOlhar.style.top =
                ySuave + "px";


                detectarBotao(
                    xSuave,
                    ySuave
                );

            }

        );

    }

    catch(erro){

        console.error(erro);


        status.innerText =

        "❌ ERRO: "

        +

        (
            erro.message
            ||
            erro
        );


        iniciar.disabled =
        false;

    }

}


/* ============================= */
/* VER QUAL BOTÃO ESTÁ NO OLHAR   */
/* ============================= */


function detectarBotao(
x,
y
){

    const elemento =
    document.elementFromPoint(
        x,
        y
    );


    const alvo =

    elemento

    ?

    elemento.closest(".area")

    :

    null;


    if(
        alvo !== alvoAtual
    ){

        limpar();


        if(alvo){

            alvoAtual =
            alvo;


            inicioOlhar =
            performance.now();


            alvo
            .classList
            .add("olhando");

        }

    }


    if(alvoAtual){

        const passou =

        performance.now()

        -

        inicioOlhar;


        const porcentagem =

        Math.min(

            100,

            passou
            /
            TEMPO
            *
            100

        );


        alvoAtual
        .querySelector(".barra")
        .style.width =

        porcentagem
        +
        "%";


        if(
            passou >= TEMPO
        ){

            const nome =
            alvoAtual.dataset.nome;


            limpar();


            selecionar(
                nome,
                "OLHAR 👁"
            );

        }

    }

}


/* ============================= */
/* LIMPAR SE SAIU DO BOTÃO        */
/* ============================= */


function limpar(){

    if(alvoAtual){

        alvoAtual
        .classList
        .remove("olhando");


        alvoAtual
        .querySelector(".barra")
        .style.width =
        "0%";

    }


    alvoAtual =
    null;

}


/* ============================= */


iniciar.addEventListener(
    "click",
    ativarOlhar
);

</script>


</body>
</html>
