<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste WebGazer.js</title>
  
  <!-- Carrega a biblioteca WebGazer.js via CDN -->
  <script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      background-color: #f4f4f9;
    }

    #painel-controle {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.9);
      padding: 15px 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      z-index: 10000;
    }

    button {
      padding: 10px 15px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 0 5px;
      background-color: #007bff;
      color: white;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    #coordenadas {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <div id="painel-controle">
    <h2>Rastreamento Ocular com WebGazer</h2>
    <button onclick="iniciarRastreamento()">Iniciar / Recalibrar</button>
    <button onclick="pausarRastreamento()">Pausar</button>
    <div id="coordenadas">Coordenadas: X: 0, Y: 0</div>
  </div>

  <script>
    let executando = false;

    async function iniciarRastreamento() {
      if (executando) return;

      // Configura o ouvinte de coordenadas do olhar
      await webgazer.setGazeListener((data, elapsedTime) => {
        if (data == null) return;

        // Arredonda as coordenadas X e Y
        const x = Math.round(data.x);
        const y = Math.round(data.y);

        // Exibe os valores na tela
        document.getElementById('coordenadas').innerText = `Coordenadas: X: ${x}, Y: ${y}`;
      }).begin();

      // Exibe a caixa da câmera e o ponto vermelho na tela onde o usuário olha
      webgazer.showPredictionPoints(true);
      webgazer.showVideoPreview(true);

      executando = true;
    }

    function pausarRastreamento() {
      if (!executando) return;
      
      webgazer.pause();
      executando = false;
      document.getElementById('coordenadas').innerText = "Rastreamento pausado.";
    }

    // Inicia o WebGazer assim que a página carregar
    window.onload = () => {
      iniciarRastreamento();
    };

    // Garante o fechamento da câmera ao fechar ou atualizar a página
    window.onbeforeunload = () => {
      webgazer.end();
    };
  </script>

</body>
</html>
